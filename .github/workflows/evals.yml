# Push-time enforcement of .claude/evals/run-evals.sh — the same checks Claude Code
# sessions run before claiming done, but guaranteed to run on EVERY push regardless of
# who made it (web UI edit, phone push, session that died mid-task). The fleet deploys
# by curling raw files from main, so main must never hold a tree that fails these.
name: evals

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the Termux runtime (3.14.6 observed on emily 2026-07-25). Was
          # pinned to 3.13 until 2026-07-26, i.e. CI was testing a runtime the
          # fleet no longer runs.
          python-version: "3.14"
      # Pillow is pinned <11 and ships no cp314 wheel, so pip builds it from
      # source and needs the image codec headers. This is the CI equivalent of
      # Termux's `pkg install libjpeg-turbo zlib freetype`. If Pillow is ever
      # unpinned past 11, the wheel exists and this step can go.
      - name: Install Pillow build dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype-dev
      - name: Install dependencies
        run: pip install -r telegram-companion-bot/requirements.txt pytest
      - name: Run eval suite
        run: bash .claude/evals/run-evals.sh
      - name: Run pytest
        run: python -m pytest telegram-companion-bot/tests/ -v
