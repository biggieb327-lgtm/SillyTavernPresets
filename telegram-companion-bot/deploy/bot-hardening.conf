# Per-instance sandbox for bot@<instance>.service. Installed as a drop-in so one bot
# can canary these boundaries without restarting or changing the rest of the fleet.
[Service]
Environment=HOME=/opt/telegram-bots/%i
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/opt/telegram-bots/%i /opt/telegram-bots/shared /opt/telegram-bots/world.txt
ProtectControlGroups=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
CapabilityBoundingSet=
SystemCallArchitectures=native
UMask=0077
